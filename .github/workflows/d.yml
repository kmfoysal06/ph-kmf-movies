name: Deploy React Vite to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the workflow on push to the main branch
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true 

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install pnpm first so setup-node can detect its cache
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Uses the latest version 9 of pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        env:
          NODE_OPTIONS: "--no-deprecation"
        with:
          node-version: 22
          cache: 'pnpm' # 2. Changed from 'npm' to 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile # 3. Equivalent to 'npm ci' for strict CI builds

      - name: Build Project
        run: pnpm run build # 4. Uses pnpm to build the Vite bundle

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

